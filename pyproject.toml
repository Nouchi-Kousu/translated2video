[project]
name = "translated2video"
version = "1.1.1"
description = "将翻译图层从PSD文件转换为视频的工具"
readme = "README.md"
authors = [
    { name = "Nouchi", email = "nouchipri@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "opencv-python>=4.11.0.86",
    "psd-tools[composite]>=1.12.1",
    "rich>=14.2.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
t2v = "translated2video.main:main"
